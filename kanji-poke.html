<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>かんじポケッと</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
:root{
  --n-color:#9aa5b1;
  --r-color:#4fc3f7;
  --sr-color:#ffca28;
  --ur-color:#ff6ec7;
  --mythic-color:#ffe066;
  --bg1:#141428;
  --bg2:#241b3f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{
  margin:0; padding:0; height:100%; overflow:hidden;
  font-family:'M PLUS Rounded 1c','Yusei Magic',sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#0d0d1a);
  color:#fff;
}
#app{position:relative; width:100%; height:100%; overflow:hidden;}
.screen{
  position:absolute; inset:0; display:flex; flex-direction:column;
  opacity:0; pointer-events:none; transition:opacity .35s ease;
}
.screen.active{opacity:1; pointer-events:auto;}
.scroll{overflow-y:auto; -webkit-overflow-scrolling:touch;}

/* ---------- common ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; flex-shrink:0;
}
.title-logo{
  font-weight:800; font-size:20px; letter-spacing:1px;
  background:linear-gradient(90deg,#ffd54f,#ff8a65,#ba68c8,#4fc3f7);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  background-size:300% 100%; animation:hue 6s linear infinite;
}
@keyframes hue{ to{ background-position:300% 0; } }
.icon-btn{
  width:42px; height:42px; border-radius:50%; border:none;
  background:rgba(255,255,255,.12); color:#fff; font-size:20px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  backdrop-filter:blur(4px);
}
.icon-btn:active{ transform:scale(.9); }
.btn{
  border:none; border-radius:16px; padding:14px 22px; font-size:16px;
  font-weight:700; font-family:inherit; cursor:pointer; color:#fff;
  background:linear-gradient(135deg,#7b5cff,#4fc3f7);
  box-shadow:0 6px 0 rgba(0,0,0,.25), 0 8px 18px rgba(80,60,200,.4);
  transition:transform .08s;
}
.btn:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.25); }
.btn.secondary{ background:rgba(255,255,255,.1); box-shadow:0 6px 0 rgba(0,0,0,.2);}
.btn.danger{ background:linear-gradient(135deg,#ff5c5c,#c62828); }
.btn:disabled{ opacity:.4; pointer-events:none; }
.pill{
  padding:5px 12px; border-radius:999px; font-size:12px; font-weight:700;
  display:inline-flex; align-items:center; gap:4px;
}

/* ---------- grade select ---------- */
#screen-grade{ align-items:center; justify-content:center; padding:20px; text-align:center;}
.grade-hero{ font-size:42px; margin-bottom:4px; }
.grade-sub{ opacity:.8; font-size:14px; margin-bottom:26px; }
.grade-grid{
  display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
  width:100%; max-width:420px;
}
.grade-card{
  background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.15);
  border-radius:20px; padding:18px 8px; cursor:pointer; transition:.15s;
}
.grade-card:active{ transform:scale(.95); }
.grade-card .num{ font-size:34px; font-weight:800; }
.grade-card .label{ font-size:13px; opacity:.85; margin-top:2px;}
.grade-card .count{ font-size:11px; opacity:.6; margin-top:6px;}
.grade-card.g1{ border-color:#ff8a80;} .grade-card.g2{ border-color:#ffd54f;}
.grade-card.g3{ border-color:#aed581;} .grade-card.g4{ border-color:#4fc3f7;}
.grade-card.g5{ border-color:#ba68c8;} .grade-card.g6{ border-color:#ff8a65;}

/* ---------- home ---------- */
#screen-home{ padding:0 18px 18px; }
.home-body{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
.ticket-bar{
  display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.08);
  padding:8px 16px; border-radius:999px; font-size:14px; font-weight:700;
}
.pack-visual{
  width:190px; height:250px; border-radius:18px; position:relative;
  background:linear-gradient(150deg,#7b5cff,#ff6ec7 50%,#4fc3f7);
  box-shadow:0 14px 30px rgba(80,40,200,.5), inset 0 0 0 3px rgba(255,255,255,.4);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  cursor:pointer; animation:float 3s ease-in-out infinite;
}
.pack-visual::before{
  content:''; position:absolute; inset:0; border-radius:18px;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 8px,transparent 8px 16px);
}
.pack-visual .kanji-big{ font-size:76px; font-weight:800; text-shadow:0 4px 10px rgba(0,0,0,.35); }
.pack-visual .pack-label{ font-size:13px; font-weight:700; margin-top:6px; background:rgba(0,0,0,.25); padding:3px 10px; border-radius:999px;}
@keyframes float{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
.homebtns{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.mythic-btn{
  background:linear-gradient(135deg,#7a5200,#ffd700,#7a5200); background-size:300% 100%;
  animation:hue 4s linear infinite; box-shadow:0 6px 0 rgba(0,0,0,.3), 0 0 18px rgba(255,215,0,.4);
  color:#2a1c00; font-weight:800;
}
.milestone-hint{ font-size:11px; opacity:.7; text-align:center; max-width:320px; }
.progress-wrap{ width:100%; max-width:360px; }
.progress-label{ display:flex; justify-content:space-between; font-size:12px; opacity:.8; margin-bottom:4px;}
.progress-track{ height:10px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden;}
.progress-fill{ height:100%; background:linear-gradient(90deg,#4fc3f7,#7b5cff); border-radius:999px; transition:width .6s ease;}

/* ---------- pack open ---------- */
#screen-pack{ align-items:center; justify-content:center; }
.pack-stage{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
.tap-hint{ position:absolute; bottom:30px; font-size:13px; opacity:.75; animation:pulse 1.6s infinite;}
@keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:.9;} }
.pack-anim{
  width:210px; height:280px; border-radius:20px;
  background:linear-gradient(150deg,#7b5cff,#ff6ec7 50%,#4fc3f7);
  box-shadow:0 20px 40px rgba(0,0,0,.5), inset 0 0 0 3px rgba(255,255,255,.4);
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  cursor:pointer; position:relative; overflow:hidden;
}
.pack-anim.shaking{ animation:shake .5s infinite; }
.pack-anim.special-pack{
  background:linear-gradient(160deg,#000,#3a2a00 30%,#7a5200 55%,#ffd700 85%);
  box-shadow:0 20px 50px rgba(255,215,0,.4), inset 0 0 0 3px rgba(255,255,255,.5);
}
@keyframes shake{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-3deg);} 75%{transform:rotate(3deg);} }
.pack-anim.torn{ animation:tearAway .5s forwards; }
@keyframes tearAway{ to{ transform:scale(1.3) rotate(8deg); opacity:0; } }
.flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:50;}
.flash.go{ animation:flashAnim .5s ease; }
@keyframes flashAnim{ 0%{opacity:0;} 15%{opacity:1;} 100%{opacity:0;} }

.reveal-stage{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; }
.card-slot-counter{ position:absolute; top:16px; font-size:13px; opacity:.7; }
.rays{
  position:absolute; width:600px; height:600px; opacity:0; pointer-events:none;
  background:conic-gradient(from 0deg, rgba(255,255,255,.25) 0 10deg, transparent 10deg 20deg);
  animation:spin 6s linear infinite;
}
.rays.show{ opacity:1; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.card{
  width:230px; height:330px; border-radius:20px; position:relative;
  perspective:1000px; cursor:pointer; z-index:2;
}
.card-inner{
  width:100%; height:100%; position:relative; transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.2,.8,.3,1.1);
}
.card.flipped .card-inner{ transform:rotateY(180deg); }
.card-face{
  position:absolute; inset:0; border-radius:20px; backface-visibility:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  overflow:hidden;
}
.card-back{
  background:linear-gradient(150deg,#3b2a6a,#1f1440);
  border:3px solid rgba(255,255,255,.25);
  display:flex; align-items:center; justify-content:center;
}
.card-back .mark{ font-size:60px; opacity:.5; }
.card-front{ transform:rotateY(180deg); border:3px solid #fff; padding:14px; }
.card-front.n{ background:linear-gradient(160deg,#4b5563,#28303d);}
.card-front.r{ background:linear-gradient(160deg,#0288d1,#01579b);}
.card-front.sr{ background:linear-gradient(160deg,#ff9800,#e65100); }
.card-front.ur{
  background:linear-gradient(160deg,#ff6ec7,#7b5cff,#4fc3f7,#ffd54f);
  background-size:400% 400%; animation:holo 3s ease infinite;
}
.card-front.mythic{
  background:linear-gradient(160deg,#000,#3a2a00 30%,#7a5200 55%,#ffd700 80%,#fff3b0);
  background-size:400% 400%; animation:holo 2.2s ease infinite;
  box-shadow:0 0 24px rgba(255,215,0,.55), inset 0 0 0 3px rgba(255,255,255,.5);
}
@keyframes holo{ 0%{background-position:0 0;} 50%{background-position:100% 100%;} 100%{background-position:0 0;} }
.card-front .rarity-tag{
  position:absolute; top:10px; left:10px; font-size:11px; font-weight:800;
  background:rgba(0,0,0,.35); padding:3px 9px; border-radius:999px;
}
.card-front .grade-tag{
  position:absolute; top:10px; right:10px; font-size:11px; font-weight:800;
  background:rgba(0,0,0,.35); padding:3px 9px; border-radius:999px;
}
.card-front .type-badge{
  position:absolute; top:38px; right:10px; font-size:10px; font-weight:800;
  border:1.5px solid; padding:2px 8px; border-radius:999px; color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.5);
}
.card-front .kanji{
  font-size:96px; font-weight:800; text-shadow:0 4px 8px rgba(0,0,0,.4);
  margin-top:8px;
}
.card-front .readings{ font-size:12px; text-align:center; opacity:.95; line-height:1.5; margin-top:4px; max-width:90%; }
.card-front .atk-name{
  font-size:11px; font-weight:800; text-align:center; margin-top:2px;
  background:rgba(0,0,0,.3); padding:2px 8px; border-radius:999px; max-width:90%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.card-front .power{
  position:absolute; bottom:12px; left:12px; font-size:20px; font-weight:800;
  display:flex; align-items:center; gap:4px;
}
.card-front .power .lbl{ font-size:10px; opacity:.8; font-weight:700; }
.card-front .meaning{ position:absolute; bottom:12px; right:12px; font-size:10px; opacity:.85; max-width:100px; text-align:right;}
.card-front .newbadge{
  position:absolute; top:38px; left:10px; background:#ff5252; font-size:10px;
  font-weight:800; padding:2px 8px; border-radius:999px; transform:rotate(-8deg);
}
.card.stack{ position:absolute; }
.sparkle-layer{ position:absolute; inset:-40px; pointer-events:none; overflow:visible; z-index:5;}
.sparkle{
  position:absolute; width:6px; height:6px; background:#fff; border-radius:50%;
  animation:sparkle 1.2s ease-out forwards;
}
@keyframes sparkle{
  0%{ transform:translate(0,0) scale(1); opacity:1;}
  100%{ transform:translate(var(--dx),var(--dy)) scale(0); opacity:0;}
}
.reveal-controls{ margin-top:18px; display:flex; gap:10px; z-index:3;}

/* ---------- collection ---------- */
#screen-collection{ padding:0 14px 10px; }
.tabs{ display:flex; gap:6px; overflow-x:auto; padding:6px 2px 10px; flex-shrink:0; }
.tab{
  flex-shrink:0; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:700;
  background:rgba(255,255,255,.08); cursor:pointer; white-space:nowrap;
}
.tab.active{ background:linear-gradient(135deg,#7b5cff,#4fc3f7); }
.coll-summary{ font-size:12px; opacity:.8; padding:0 4px 8px; flex-shrink:0; }
.coll-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); gap:8px;
  flex:1; overflow-y:auto; padding-bottom:20px;
}
.mini-card{
  aspect-ratio:2/3; border-radius:10px; border:2px solid rgba(255,255,255,.2);
  display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800;
  cursor:pointer; position:relative;
}
.mini-card.locked{ background:rgba(255,255,255,.05); color:rgba(255,255,255,.15); border-style:dashed; }
.mini-card.n{ background:linear-gradient(160deg,#4b5563,#28303d);}
.mini-card.r{ background:linear-gradient(160deg,#0288d1,#01579b);}
.mini-card.sr{ background:linear-gradient(160deg,#ff9800,#e65100);}
.mini-card.ur{ background:linear-gradient(160deg,#ff6ec7,#7b5cff,#4fc3f7); background-size:300% 300%; animation:holo 4s ease infinite;}
.mini-card.mythic{ background:linear-gradient(160deg,#000,#7a5200,#ffd700); background-size:300% 300%; animation:holo 3s ease infinite; box-shadow:0 0 10px rgba(255,215,0,.5);}
.mini-card .dot{ position:absolute; bottom:4px; right:4px; width:7px; height:7px; border-radius:50%; }

/* ---------- modal ---------- */
.modal-bg{
  position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100;
  display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s;
  padding:20px;
}
.modal-bg.show{ opacity:1; pointer-events:auto; }
.modal{
  background:#1c1533; border-radius:20px; padding:22px; max-width:360px; width:100%;
  max-height:85vh; overflow-y:auto; border:1px solid rgba(255,255,255,.15);
}
.modal h3{ margin:0 0 14px; font-size:18px; }
.modal-detail-card{ display:flex; justify-content:center; margin-bottom:14px; }
.setting-row{
  display:flex; align-items:center; justify-content:space-between; padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.08); font-size:14px;
}
.switch{ width:46px; height:26px; border-radius:999px; background:rgba(255,255,255,.15); position:relative; cursor:pointer; flex-shrink:0;}
.switch.on{ background:#4fc3f7; }
.switch .knob{ position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.2s;}
.switch.on .knob{ left:22px; }
.grade-list-modal{ display:flex; flex-direction:column; gap:8px; margin:10px 0 16px; }
.grade-opt{
  padding:12px; border-radius:12px; background:rgba(255,255,255,.06); cursor:pointer;
  display:flex; justify-content:space-between; align-items:center; font-size:14px; font-weight:700;
  border:2px solid transparent;
}
.grade-opt.current{ border-color:#4fc3f7; background:rgba(79,195,247,.15); }
.modal-actions{ display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.85); padding:10px 20px; border-radius:999px; font-size:13px;
  z-index:200; opacity:0; transition:opacity .3s; pointer-events:none;
}
.toast.show{ opacity:1; }

/* ---------- battle ---------- */
.battle-vs-card{ width:130px; height:190px; }
.battle-vs-card .kanji{ font-size:40px !important; margin-top:0 !important; }
.battle-vs-card .power{ position:static !important; margin-top:4px; justify-content:center; }
.mini-card.selectable{ cursor:pointer; }
.mini-card.picked{ outline:3px solid #4fc3f7; }
.battle-arena-wrap{ position:relative; width:100%; display:flex; justify-content:center; }
.hand-row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px; width:100%; max-width:420px; }
.hand-card{
  width:56px; aspect-ratio:2/3; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:22px; font-weight:800; cursor:pointer; border:2px solid rgba(255,255,255,.3); transition:transform .12s;
}
.hand-card:active{ transform:scale(.88); }
.hand-card.disabled{ opacity:.35; pointer-events:none; }
.hand-card.n{ background:linear-gradient(160deg,#4b5563,#28303d);}
.hand-card.r{ background:linear-gradient(160deg,#0288d1,#01579b);}
.hand-card.sr{ background:linear-gradient(160deg,#ff9800,#e65100);}
.hand-card.ur{ background:linear-gradient(160deg,#ff6ec7,#7b5cff,#4fc3f7); background-size:300% 300%; animation:holo 4s ease infinite;}
.hand-card.mythic{ background:linear-gradient(160deg,#000,#7a5200,#ffd700); background-size:300% 300%; animation:holo 3s ease infinite;}

@keyframes atkPop{
  0%{ transform:translate(-50%,-40%) scale(.3); opacity:0; }
  30%{ transform:translate(-50%,-50%) scale(1.15); opacity:1; }
  70%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
  100%{ transform:translate(-50%,-65%) scale(.9); opacity:0; }
}
.atk-burst-text{
  position:absolute; top:38%; transform:translate(-50%,-50%);
  font-size:15px; font-weight:800; white-space:nowrap; z-index:20;
  padding:7px 14px; border-radius:12px; pointer-events:none; color:#fff;
  animation:atkPop .9s ease forwards;
}
.atk-burst-text.n{ background:rgba(154,165,177,.92); }
.atk-burst-text.r{ background:rgba(2,136,209,.92); }
.atk-burst-text.sr{ background:rgba(230,81,0,.92); }
.atk-burst-text.ur{ background:linear-gradient(90deg,#ff6ec7,#7b5cff); }
.atk-burst-text.mythic{ background:linear-gradient(90deg,#7a5200,#ffd700); color:#2a1c00; box-shadow:0 0 20px rgba(255,215,0,.8);}

@keyframes impactRing{
  0%{ transform:translate(-50%,-50%) scale(.2); opacity:.9; }
  100%{ transform:translate(-50%,-50%) scale(2.4); opacity:0; }
}
.impact-ring{
  position:absolute; top:50%; width:110px; height:110px;
  border:6px solid #fff; border-radius:50%; pointer-events:none; z-index:15;
  animation:impactRing .5s ease-out forwards;
}
@keyframes shakeScreen{
  0%,100%{ transform:translate(0,0); }
  20%{ transform:translate(-6px,3px); }
  40%{ transform:translate(6px,-3px); }
  60%{ transform:translate(-4px,2px); }
  80%{ transform:translate(4px,-2px); }
}
.shake-active{ animation:shakeScreen .4s; }

/* ---------- gym / elite four ---------- */
.gym-list{ display:flex; flex-direction:column; gap:10px; }
.gym-row{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px;
  background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.1); cursor:pointer;
}
.gym-row:active{ transform:scale(.98); }
.gym-row.done{ border-color:#4fc3f7; background:rgba(79,195,247,.1); }
.gym-row.elite{ border-color:rgba(255,215,0,.3); }
.gym-row.elite.done{ border-color:#ffd700; background:rgba(255,215,0,.12); }
.gym-icon{ font-size:30px; width:44px; text-align:center; flex-shrink:0; }
.gym-info{ flex:1; min-width:0; }
.gym-name{ font-weight:800; font-size:14px; }
.gym-title{ font-weight:400; font-size:11px; opacity:.7; margin-left:4px; }
.gym-types{ font-size:11px; opacity:.75; margin-top:2px; }
.gym-badge{ font-size:22px; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">

  <!-- 学年選択 -->
  <div class="screen active" id="screen-grade">
    <div class="grade-hero">📚✨</div>
    <div class="title-logo" style="font-size:26px;">かんじポケっと</div>
    <div class="grade-sub">じぶんの がくねんを えらんでね<br>(あとから へんこうも できます)</div>
    <div class="grade-grid" id="grade-grid"></div>
  </div>

  <!-- ホーム -->
  <div class="screen" id="screen-home">
    <div class="topbar">
      <div class="title-logo">かんじポケっと</div>
      <button class="icon-btn" id="btn-menu">⚙️</button>
    </div>
    <div class="home-body">
      <div class="ticket-bar">🎟️ <span id="ticket-count">-</span>/5 <span id="ticket-timer" style="opacity:.6; font-weight:400; font-size:12px;"></span></div>
      <div class="pack-visual" id="pack-visual">
        <div class="kanji-big" id="pack-kanji-preview">漢</div>
        <div class="pack-label" id="pack-grade-label">小学1年生パック</div>
      </div>
      <div class="homebtns">
        <button class="btn" id="btn-open-pack">パックを あける</button>
        <button class="btn secondary" id="btn-daily" style="display:none;">🎁 デイリーパック</button>
      </div>
      <div class="progress-wrap">
        <div class="progress-label"><span>コレクション</span><span id="progress-text">0/0</span></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%;"></div></div>
      </div>
      <div class="homebtns">
        <button class="btn secondary" id="btn-goto-collection">📖 ずかんを見る</button>
        <button class="btn secondary" id="btn-goto-battle">⚔️ フリーバトル</button>
      </div>
      <button class="btn secondary" id="btn-goto-gym" style="background:linear-gradient(135deg,#4a3a7a,#2a1f52);">🏅 ジム＆四天王</button>

function buildTiers(list){
  const sorted=[...list].sort((a,b)=>a.s-b.s);
  const n=sorted.length;
  const nCut=Math.floor(n*0.5), rCut=Math.floor(n*0.85);
  const tierMap={};
  sorted.forEach((e,i)=>{
    tierMap[e.k]= i<nCut? 'n' : (i<rCut? 'r':'sr');
  });
  return tierMap;
}

const ALL_CARDS = { n:[], r:[], sr:[], ur:[], mythic:[] };
function buildAllCardsPool(){
  for(let g=1; g<=6; g++){
    GRADE_DATA[g].forEach(e=>{
      const t=GRADE_TIERS[g][e.k];
      ALL_CARDS[t].push({entry:e, tier:t});
    });
  }
  RARE_POOL.forEach(e=>ALL_CARDS.ur.push({entry:e, tier:'ur'}));
  MYTHIC_POOL.forEach(e=>ALL_CARDS.mythic.push({entry:e, tier:'mythic'}));
}

function generateNpcDeck(npc){
  const cards=[];
  for(let i=0;i<5;i++){
    const tier=weightedPick(npc.tiers);
    let candidates = ALL_CARDS[tier];
    if(npc.types && npc.types.length && Math.random() < (npc.typeFocus||0)){
      const filtered = candidates.filter(c => npc.types.includes(c.entry.type));
      if(filtered.length) candidates = filtered;
    }
    const chosen = candidates[Math.floor(Math.random()*candidates.length)];
    cards.push({entry:chosen.entry, tier:chosen.tier});
  }
  return cards;
}

// TYPE_WEAK[A] = Aが弱いタイプ(そのタイプに攻撃力2倍で負けやすい)
const TYPE_WEAK = {};
TYPE_LIST.forEach(a=>{ TYPE_WEAK[TYPE_BEATS[a]] = a; });
function typeMatchup(attackerType, defenderType){
  // attackerType が defenderType に対して有利なら 2倍
  if(TYPE_BEATS[attackerType]===defenderType) return 2;
  return 1;
}

function powerOf(entry, tier){
  return Math.round(entry.s*11 + TIER_BONUS[tier] + (entry.k.codePointAt(0)%9));
}
function tierOfCard(gradeNum, kanji){
  if(MYTHIC_LOOKUP[kanji]) return 'mythic';
  if(RARE_LOOKUP[kanji]) return 'ur';
  return GRADE_TIERS[gradeNum][kanji] || 'n';
}

/* ============ STORAGE ============ */
const SAVE_KEY='kanjipoke:save:v1';
const TICKET_MAX=5, TICKET_INTERVAL_MS=30*60*1000; // 30分で1枚回復
let STATE=null;

function defaultState(){
  return {
    grade:null,
    owned:{},        // "grade:kanji" -> true  (curriculum cards)
    ownedRare:{},     // kanji -> true (rare pool cards / UR)
    ownedMythic:{},   // kanji -> true (mythic pool cards / 特別パック限定)
    seen:{},          // for NEW badge tracking, same keys as owned
    tickets:TICKET_MAX,
    lastTicketTime:Date.now(),
    lastDailyClaim:0,
    totalPacksOpened:0,
    specialTickets:0,
    milestonesClaimed:[],
    battleWins:0,
    battleLosses:0,
    badges:{},
    eliteDefeated:{},
    champion:false,
    bgmOn:true,
    sfxOn:true
  };
}

async function loadState(){
  try{
    const res = await window.storage.get(SAVE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      STATE = Object.assign(defaultState(), parsed);
    } else {
      STATE = defaultState();
    }
  }catch(e){
    STATE = defaultState();
  }
  regenTickets();
}

let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    try{ await window.storage.set(SAVE_KEY, JSON.stringify(STATE), false); }catch(e){ console.error('save failed', e); }
  }, 250);
}

function regenTickets(){
  if(STATE.tickets>=TICKET_MAX) { STATE.lastTicketTime=Date.now(); return; }
  const elapsed = Date.now()-STATE.lastTicketTime;
  const gained = Math.floor(elapsed/TICKET_INTERVAL_MS);
  if(gained>0){
    STATE.tickets = Math.min(TICKET_MAX, STATE.tickets+gained);
    STATE.lastTicketTime += gained*TICKET_INTERVAL_MS;
    if(STATE.tickets>=TICKET_MAX) STATE.lastTicketTime=Date.now();
  }
}

function isDailyAvailable(){
  const today = new Date().toDateString();
  return new Date(STATE.lastDailyClaim).toDateString() !== today;
}

/* ============ AUDIO (すべて安全に失敗できるようガード) ============ */
let audioReady=false, audioAvailable=true, bgmPart=null, bgmSynth=null;
function ensureAudio(){
  if(audioReady) return;
  audioReady=true;
  if(typeof Tone==='undefined'){ audioAvailable=false; console.warn('Tone.js not loaded; audio disabled'); return; }
  try{
    bgmSynth = new Tone.PolySynth(Tone.Synth,{
      oscillator:{type:'triangle'}, envelope:{attack:0.02, decay:0.2, sustain:0.3, release:0.6}
    }).toDestination();
    bgmSynth.volume.value=-16;
    const notes=['C4','E4','G4','A4','G4','E4','D4','G4','B4','A4','G4','E4'];
    let i=0;
    bgmPart = new Tone.Loop(time=>{
      bgmSynth.triggerAttackRelease(notes[i%notes.length], '8n', time);
      i++;
    }, '4n');
    Tone.Transport.bpm.value=96;
    if(STATE.bgmOn){ Tone.start().catch(()=>{}); Tone.Transport.start(); bgmPart.start(0); }
  }catch(e){
    audioAvailable=false;
    console.warn('audio init failed, continuing without sound', e);
  }
}
function setBgm(on){
  STATE.bgmOn=on;
  saveState();
  try{
    if(!audioReady) ensureAudio();
    if(!audioAvailable || !bgmPart) return;
    if(on){ Tone.start().catch(()=>{}); Tone.Transport.start(); bgmPart.start(0); }
    else { bgmPart.stop(); Tone.Transport.stop(); }
  }catch(e){ console.warn('bgm toggle failed', e); }
}
function sfx(type){
  try{
    if(!STATE.sfxOn) return;
    if(!audioReady) ensureAudio();
    if(!audioAvailable) return;
    Tone.start().catch(()=>{});
    const now = Tone.now();
    if(type==='tap'){
      const s=new Tone.Synth({oscillator:{type:'square'}}).toDestination();
      s.volume.value=-20; s.triggerAttackRelease('C6','16n',now);
      setTimeout(()=>s.dispose(),500);
    } else if(type==='tear'){
      const noise=new Tone.NoiseSynth({noise:{type:'white'},envelope:{attack:0.01,decay:0.4,sustain:0}}).toDestination();
      noise.volume.value=-10; noise.triggerAttackRelease('8n',now);
      setTimeout(()=>noise.dispose(),600);
    } else if(type==='flip'){
      const s=new Tone.Synth({oscillator:{type:'triangle'}}).toDestination();
      s.volume.value=-14; s.triggerAttackRelease('A5','16n',now);
      setTimeout(()=>s.dispose(),400);
    } else if(type==='n'){
      const s=new Tone.Synth().toDestination(); s.volume.value=-16;
      s.triggerAttackRelease('E5','8n',now);
      setTimeout(()=>s.dispose(),500);
    } else if(type==='r'){
      const s=new Tone.PolySynth(Tone.Synth).toDestination(); s.volume.value=-12;
      s.triggerAttackRelease(['C5','E5'],'8n',now);
      setTimeout(()=>s.dispose(),700);
    } else if(type==='sr'){
      const s=new Tone.PolySynth(Tone.Synth).toDestination(); s.volume.value=-9;
      s.triggerAttackRelease(['C5','E5','G5'],'4n',now);
      s.triggerAttackRelease(['E5','G5','C6'],'4n',now+0.18);
      setTimeout(()=>s.dispose(),1200);
    } else if(type==='ur'){
      const s=new Tone.PolySynth(Tone.Synth).toDestination(); s.volume.value=-6;
      const chord=['C5','E5','G5','C6'];
      s.triggerAttackRelease(chord,'8n',now);
      s.triggerAttackRelease(chord.map(n=>n),'4n',now+0.22);
      const bell=new Tone.MetalSynth({volume:-14}).toDestination();
      for(let i=0;i<5;i++) bell.triggerAttackRelease('4n', now+i*0.09);
      setTimeout(()=>{s.dispose(); bell.dispose();},1600);
    }
  }catch(e){ console.warn('sfx failed', type, e); }
}

/* ============ HOME ============ */
function goHome(){
  regenTickets(); saveState();
  checkMilestones();
  updateHomeUI();
  showScreen('screen-home');
}
function totalOwnedCount(){
  let c=Object.keys(STATE.owned).filter(k=>STATE.owned[k]).length;
  c+=Object.keys(STATE.ownedRare).filter(k=>STATE.ownedRare[k]).length;
  return c;
}
function totalCardCount(){
  let c=0; for(let g=1; g<=6; g++) c+=GRADE_DATA[g].length;
  return c+RARE_POOL.length;
}
function nextMilestone(){
  const owned=totalOwnedCount();
  return MILESTONES.find(m=>!STATE.milestonesClaimed.includes(m)) || null;
}
function checkMilestones(){
  const owned=totalOwnedCount();
  let gained=0;
  MILESTONES.forEach(m=>{
    if(owned>=m && !STATE.milestonesClaimed.includes(m)){
      STATE.milestonesClaimed.push(m);
      STATE.specialTickets=(STATE.specialTickets||0)+1;
      gained++;
    }
  });
  if(gained>0){
    saveState();
    setTimeout(()=>toast('🌟 ずかん '+owned+'まい達成！ ひでんチケット+'+gained, true), 400);
  }
}
function updateHomeUI(){
  const g=STATE.grade;
  document.getElementById('pack-grade-label').textContent=GRADE_LABEL[g]+'パック';
  const sample=GRADE_DATA[g][Math.floor(Math.random()*GRADE_DATA[g].length)];
  document.getElementById('pack-kanji-preview').textContent=sample.k;
  document.getElementById('ticket-count').textContent=STATE.tickets;
  document.getElementById('btn-open-pack').disabled = STATE.tickets<=0;
  if(STATE.tickets<TICKET_MAX){
    const remain = TICKET_INTERVAL_MS - (Date.now()-STATE.lastTicketTime);
    const mins = Math.max(0,Math.ceil(remain/60000));
    document.getElementById('ticket-timer').textContent = `(つぎまで ${mins}ふん)`;
  } else {
    document.getElementById('ticket-timer').textContent='(まんたん!)';
  }
  document.getElementById('btn-daily').style.display = isDailyAvailable() ? 'inline-flex':'none';
  const owned=totalOwnedCount(), total=totalCardCount();
  document.getElementById('progress-text').textContent=`${owned}/${total}`;
  document.getElementById('progress-fill').style.width=(owned/total*100)+'%';
  const specialBtn=document.getElementById('btn-special-pack');
  const hasSpecial=(STATE.specialTickets||0)>0;
  specialBtn.style.display = hasSpecial ? 'inline-flex' : 'none';
  document.getElementById('special-ticket-count').textContent = STATE.specialTickets||0;
  const nm=nextMilestone();
  document.getElementById('milestone-hint').textContent = nm ? `📖 あと ${Math.max(0,nm-owned)}まいで ひでんチケット獲得！(${owned}/${nm})` : (hasSpecial? '' : '🎉 すべての マイルストーン達成！');
}
setInterval(()=>{ if(document.getElementById('screen-home').classList.contains('active')){ regenTickets(); updateHomeUI(); } }, 15000);

/* ============ PACK OPENING ============ */
let currentPull=[];
let revealIndex=0;

function weightedPick(weights){
  const total=Object.values(weights).reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(const k in weights){ if(r<weights[k]) return k; r-=weights[k]; }
  return Object.keys(weights)[0];
}
function pickCardOfTier(gradeNum, tier){
  if(tier==='ur'){
    return RARE_POOL[Math.floor(Math.random()*RARE_POOL.length)];
  }
  const pool = GRADE_DATA[gradeNum].filter(e=>GRADE_TIERS[gradeNum][e.k]===tier);
  const arr = pool.length? pool : GRADE_DATA[gradeNum];
  return arr[Math.floor(Math.random()*arr.length)];
}
function generatePack(gradeNum){
  const cards=[];
  const normalWeights={n:60,r:28,sr:9,ur:3};
  const lastWeights={r:38,sr:38,ur:24};
  for(let i=0;i<4;i++){
    const tier=weightedPick(normalWeights);
    const entry=pickCardOfTier(gradeNum,tier);
    cards.push({entry, tier: tier==='ur'?'ur':tier});
  }
  const lastTier=weightedPick(lastWeights);
  const lastEntry=pickCardOfTier(gradeNum,lastTier);
  cards.push({entry:lastEntry, tier:lastTier});
  return cards;
}
function generateSpecialPack(){
  // ひでんパック: 通常パックには出てこない「ひでん」カードのみ
  const cards=[];
  for(let i=0;i<5;i++){
    const entry=MYTHIC_POOL[Math.floor(Math.random()*MYTHIC_POOL.length)];
    cards.push({entry, tier:'mythic'});
  }
  return cards;
}

let currentPackMode='normal'; // 'normal' | 'special'

function openPackFlow(isDaily){
  currentPackMode='normal';
  if(!isDaily){
    if(STATE.tickets<=0){ toast('チケットが たりません'); return; }
    STATE.tickets-=1;
  } else {
    STATE.lastDailyClaim=Date.now();
  }
  STATE.totalPacksOpened+=1;
  saveState();
  currentPull=generatePack(STATE.grade);
  revealIndex=0;
  showScreen('screen-pack');
  setupPackAnim();
}

function openSpecialPackFlow(){
  if((STATE.specialTickets||0)<=0){ toast('ひでんチケットが たりません'); return; }
  currentPackMode='special';
  STATE.specialTickets-=1;
  saveState();
  currentPull=generateSpecialPack();
  revealIndex=0;
  showScreen('screen-pack');
  setupPackAnim();
}

function setupPackAnim(){
  const stage=document.getElementById('pack-stage');
  stage.querySelectorAll('.reveal-stage').forEach(n=>n.remove());
  const anim=document.getElementById('pack-anim');
  anim.style.display='flex';
  anim.classList.remove('shaking','torn');
  anim.style.opacity='1'; anim.style.pointerEvents='auto';
  const isSpecial = currentPackMode==='special';
  anim.classList.toggle('special-pack', isSpecial);
  document.getElementById('pack-anim-label').textContent = isSpecial ? '🌟 ひでんパック' : GRADE_LABEL[STATE.grade]+'パック';
  document.getElementById('tap-hint').style.display='block';
  let opened=false;
  const doOpen=()=>{
    if(opened) return;
    opened=true;
    stage.onclick=null;
    anim.onclick=null;
    try{ sfx('tap'); ensureAudio(); }catch(e){ console.warn('open tap sfx failed', e); }
    anim.classList.add('shaking');
    document.getElementById('tap-hint').style.display='none';
    setTimeout(()=>{
      try{
        try{ sfx('tear'); }catch(e){ console.warn('tear sfx failed', e); }
        anim.classList.remove('shaking');
        anim.classList.add('torn');
        const flash=document.getElementById('flash');
        flash.classList.add('go');
        setTimeout(()=>{
          flash.classList.remove('go');
          anim.style.display='none';
          startReveal();
        },350);
      }catch(e){
        console.error('pack tear sequence failed', e);
        toast('⚠️ 開封エラー: '+e.message, true);
        anim.style.display='none';
        startReveal();
      }
    }, 550);
  };
  anim.onclick=doOpen;
  stage.onclick=doOpen; // 画面のどこをタップしても開封できるように(当たり判定の保険)
}

function startReveal(){
  try{
    startRevealInner();
  }catch(e){
    console.error('startReveal failed', e);
    toast('⚠️ 表示エラー: '+e.message, true);
    setTimeout(goHome, 1500);
  }
}
function startRevealInner(){
  const stage=document.getElementById('pack-stage');
  const wrap=document.createElement('div');
  wrap.className='reveal-stage';
  wrap.innerHTML=`
    <div class="card-slot-counter" id="slot-counter"></div>
    <div class="rays" id="rays"></div>
    <div class="card" id="reveal-card"><div class="card-inner">
        <div class="card-face card-back"><div class="mark">漢</div></div>
        <div class="card-face card-front" id="reveal-front"></div>
      </div></div>
    <div class="reveal-controls">
      <button class="btn secondary" id="btn-next-card">つぎへ →</button>
    </div>`;
  stage.appendChild(wrap);
  showCardAtIndex();
  document.getElementById('btn-next-card').onclick=()=>{
    try{ sfx('tap'); }catch(e){}
    revealIndex++;
    if(revealIndex>=currentPull.length){ finishReveal(); }
    else { showCardAtIndex(); }
  };
  document.getElementById('reveal-card').onclick=()=>{ try{ flipCurrentCard(); }catch(e){ console.warn(e); } };
}

function buildCardFrontHTML(entry, tier, gradeNum, isNewFlag){
  const isSpecialTier = tier==='ur' || tier==='mythic';
  const gradeTxt = tier==='mythic' ? 'ひでん' : (tier==='ur' ? 'とくべつ' : GRADE_LABEL[gradeNum].replace('小学','').replace('生',''));
  const onList=(entry.on||[]).join('・');
  const kunList=(entry.kun||[]).join('・');
  const readingTxt=[onList?('音:'+onList):'', kunList?('訓:'+kunList):''].filter(Boolean).join(' ');
  const meaning=(entry.m||[]).slice(0,2).join(', ');
  const pw=powerOf(entry,tier);
  const type=entry.type||'火';
  return `
    <div class="rarity-tag">${TIER_NAME[tier]}</div>
    <div class="type-badge" style="background:${TYPE_COLOR[type]}55; border-color:${TYPE_COLOR[type]};">${TYPE_EMOJI[type]} ${type}</div>
    <div class="grade-tag">${gradeTxt}</div>
    ${isNewFlag?'<div class="newbadge">NEW!</div>':''}
    <div class="kanji">${entry.k}</div>
    <div class="atk-name">技: ${entry.atk||'-'}</div>
    <div class="readings">${readingTxt||'&nbsp;'}</div>
    <div class="power"><span class="lbl">ちから</span>${pw}</div>
    <div class="meaning">${meaning}</div>
  `;
}

function showCardAtIndex(){
  const {entry,tier} = currentPull[revealIndex];
  document.getElementById('slot-counter').textContent = `${revealIndex+1} / ${currentPull.length}`;
  const card=document.getElementById('reveal-card');
  card.classList.remove('flipped');
  const isNewFlag = isNewCard(entry.k, tier);
  const front=document.getElementById('reveal-front');
  front.className='card-face card-front '+tier;
  front.innerHTML=buildCardFrontHTML(entry,tier,STATE.grade,isNewFlag);
  registerOwned(entry.k, tier);
  saveState();
  checkMilestones();
  const rays=document.getElementById('rays');
  rays.classList.toggle('show', tier==='sr'||tier==='ur'||tier==='mythic');
}

function flipCurrentCard(){
  const card=document.getElementById('reveal-card');
  if(card.classList.contains('flipped')) return;
  card.classList.add('flipped');
  const {tier}=currentPull[revealIndex];
  sfx('flip');
  setTimeout(()=>{
    sfx(tier==='mythic' ? 'ur' : tier);
    if(tier==='sr'||tier==='ur'||tier==='mythic') spawnSparkles(card);
    if(tier==='ur'||tier==='mythic') flashScreen();
  },250);
}

function spawnSparkles(cardEl){
  const layer=document.createElement('div');
  layer.className='sparkle-layer';
  cardEl.appendChild(layer);
  const tier=currentPull[revealIndex] && currentPull[revealIndex].tier;
  const n = tier==='mythic'? 36 : (tier==='ur'?26:14);
  for(let i=0;i<n;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    const ang=Math.random()*Math.PI*2, dist=60+Math.random()*140;
    s.style.setProperty('--dx',(Math.cos(ang)*dist)+'px');
    s.style.setProperty('--dy',(Math.sin(ang)*dist)+'px');
    s.style.left=(50+Math.random()*20-10)+'%';
    s.style.top=(50+Math.random()*20-10)+'%';
    s.style.background=['#fff','#ffd54f','#ff6ec7','#4fc3f7'][Math.floor(Math.random()*4)];
    s.style.animationDelay=(Math.random()*0.2)+'s';
    layer.appendChild(s);
  }
  setTimeout(()=>layer.remove(),1500);
}
function flashScreen(){
  const f=document.getElementById('flash');
  f.classList.add('go');
  setTimeout(()=>f.classList.remove('go'),500);
}

function isNewCard(kanji, tier){
  if(tier==='mythic') return !STATE.ownedMythic[kanji];
  if(tier==='ur') return !STATE.ownedRare[kanji];
  return !STATE.owned[STATE.grade+':'+kanji];
}
function registerOwned(kanji, tier){
  if(tier==='mythic'){ STATE.ownedMythic[kanji]=true; }
  else if(tier==='ur'){ STATE.ownedRare[kanji]=true; }
  else { STATE.owned[STATE.grade+':'+kanji]=true; }
}

function finishReveal(){
  try{
    document.querySelectorAll('.reveal-stage').forEach(n=>n.remove());
  }catch(e){ console.warn('cleanup failed', e); }
  goHome();
  toast('パックを ひらきました！');
}

function openCollection(){

  renderCollectionGrid();
  showScreen('screen-collection');

function renderTabs(){

    tabs.appendChild(t);

  rareTab.className='tab'+(currentTab==='rare'?' active':'');

  tabs.appendChild(rareTab);
  const mythicTab=document.createElement('div');
  mythicTab.className='tab'+(currentTab==='mythic'?' active':'');
  mythicTab.textContent='🌟ひでん';
  mythicTab.onclick=()=>{ sfx('tap'); currentTab='mythic'; renderTabs(); renderCollectionGrid(); };
  tabs.appendChild(mythicTab);
}
function renderCollectionGrid(){
  const grid=document.getElementById('coll-grid');
  grid.innerHTML='';
  let list, ownedMap, mode='grade';
  if(currentTab==='rare'){ list=RARE_POOL; ownedMap=STATE.ownedRare; mode='rare'; }
  else if(currentTab==='mythic'){ list=MYTHIC_POOL; ownedMap=STATE.ownedMythic; mode='mythic'; }
  else { list=GRADE_DATA[currentTab]; ownedMap=STATE.owned; }
  const ownedCount = list.filter(e=> mode==='grade' ? ownedMap[currentTab+':'+e.k] : ownedMap[e.k]).length;
  const label = mode==='mythic' ? '🌟 ひでんカード ' : (mode==='rare' ? '✨ とくべつカード ' : (currentTab+'年生の かんじ '));
  document.getElementById('coll-summary').textContent = label+`${ownedCount} / ${list.length}`;
  list.forEach(entry=>{
    const owned = mode==='grade' ? ownedMap[currentTab+':'+entry.k] : ownedMap[entry.k];
    const tier = mode==='mythic' ? 'mythic' : (mode==='rare' ? 'ur' : GRADE_TIERS[currentTab][entry.k]);
    const el=document.createElement('div');
    el.className='mini-card '+(owned? tier : 'locked');

/* ============ BATTLE ============ */
let battleState=null;

function getOwnedCardPool(){
  const arr=[];
  GRADE_DATA[STATE.grade].forEach(e=>{
    if(STATE.owned[STATE.grade+':'+e.k]) arr.push({entry:e, tier:GRADE_TIERS[STATE.grade][e.k]});
  });
  RARE_POOL.forEach(e=>{
    if(STATE.ownedRare[e.k]) arr.push({entry:e, tier:'ur'});
  });
  MYTHIC_POOL.forEach(e=>{
    if(STATE.ownedMythic[e.k]) arr.push({entry:e, tier:'mythic'});
  });
  return arr;
}

function openBattle(mode, npc){
  battleState={ phase:'select', selected:[], mode: mode||'free', npc: npc||null };
  renderBattleSelect();
  showScreen('screen-battle');
}
function openGymBattle(leaderId){
  const npc=GYM_LEADERS.find(l=>l.id===leaderId);
  if(!npc) return;
  openBattle('gym', npc);
}
function openEliteBattle(memberId){
  const npc=ELITE_FOUR.find(l=>l.id===memberId);
  if(!npc) return;
  openBattle('elite', npc);
}

function renderBattleSelect(){
  const body=document.getElementById('battle-body');
  const pool=getOwnedCardPool();
  const npc=battleState.npc;
  const headerHtml = npc
    ? `<div style="text-align:center; margin-bottom:8px;">
         <div style="font-size:34px;">${npc.icon}</div>
         <div style="font-weight:800;">${npc.name}</div>
         <div style="font-size:12px; opacity:.75;">${npc.title}</div>
       </div>`
    : '';
  if(pool.length===0){
    body.innerHTML=headerHtml+`<div style="text-align:center; margin-top:30px; opacity:.85; line-height:1.7;">まだ カードが ないよ！<br>まず パックを あけて<br>カードを あつめよう✨</div>`;
    return;
  }
  const need=Math.min(5,pool.length);
  body.innerHTML=headerHtml+`
    <div style="text-align:center; font-size:13px; opacity:.85; margin:8px 0 4px;">
      デッキに いれる カードを ${need}まい えらんでね<br>
      えらんだ: <span id="sel-count">0</span> / ${need}
    </div>
    <div class="coll-grid" id="battle-select-grid" style="width:100%; max-height:40vh;"></div>
    <button class="btn" id="btn-start-battle" style="margin-top:16px;" disabled>⚔️ バトルかいし！</button>
  `;
  const grid=document.getElementById('battle-select-grid');
  pool.forEach((c,idx)=>{
    const el=document.createElement('div');
    el.className='mini-card selectable '+c.tier;
    el.textContent=c.entry.k;
    el.onclick=()=>{
      try{ sfx('tap'); }catch(e){}
      const i=battleState.selected.indexOf(idx);
      if(i>=0){ battleState.selected.splice(i,1); el.classList.remove('picked'); }
      else{
        if(battleState.selected.length>=need) return;
        battleState.selected.push(idx); el.classList.add('picked');
      }
      document.getElementById('sel-count').textContent=battleState.selected.length;
      document.getElementById('btn-start-battle').disabled = battleState.selected.length!==need;
    };
    grid.appendChild(el);
  });
  document.getElementById('btn-start-battle').onclick=()=>{
    try{ sfx('tap'); }catch(e){}
    battleState.playerDeck = battleState.selected.map(i=>pool[i]);
    if(battleState.mode==='free'){
      battleState.oppDeck = generatePack(STATE.grade).slice(0, battleState.playerDeck.length);
    } else {
      battleState.oppDeck = generateNpcDeck(battleState.npc).slice(0, battleState.playerDeck.length);
    }
    battleState.round=0; battleState.playerScore=0; battleState.oppScore=0; battleState.phase='arena';
    renderBattleArena();
  };
}

function renderBattleArena(){
  battleState.playerHand = battleState.playerDeck.slice();
  battleState.oppHand = battleState.oppDeck.slice();
  battleState.busy = false;
  const body=document.getElementById('battle-body');
  body.innerHTML=`
    <div style="display:flex; justify-content:space-between; width:100%; max-width:360px; margin:8px 0 2px; font-weight:800; font-size:15px;">
      <div>🧑 あなた: <span id="p-score">0</span></div>
      <div>🤖 ライバル: <span id="o-score">0</span></div>
    </div>
    <div style="font-size:12px; opacity:.7; margin-bottom:10px;">のこり手札 <span id="hand-count">${battleState.playerHand.length}</span>まい</div>
    <div class="battle-arena-wrap" id="battle-arena-wrap">
      <div style="display:flex; gap:14px; align-items:center; justify-content:center; position:relative;">
        <div class="card battle-vs-card" id="p-card"><div class="card-inner">
          <div class="card-face card-back"><div class="mark" style="font-size:26px;">?</div></div>
          <div class="card-face card-front" id="p-card-front" style="padding:8px;"></div>
        </div></div>
        <div style="font-weight:800; font-size:20px;">VS</div>
        <div class="card battle-vs-card" id="o-card"><div class="card-inner">
          <div class="card-face card-back"><div class="mark" style="font-size:26px;">?</div></div>
          <div class="card-face card-front" id="o-card-front" style="padding:8px;"></div>
        </div></div>
      </div>
    </div>
    <div id="round-result" style="margin-top:10px; font-weight:800; font-size:15px; min-height:22px; text-align:center;"></div>
    <div style="font-size:12px; opacity:.8; margin-top:12px; text-align:center;">手札から カードを えらんで タップしよう！</div>
    <div class="hand-row" id="hand-row"></div>
  `;
  renderPlayerHand();
}

function renderPlayerHand(){
  const row=document.getElementById('hand-row');
  if(!row) return;
  row.innerHTML='';
  const hand=battleState.playerHand;
  document.getElementById('hand-count').textContent=hand.length;
  hand.forEach((c,idx)=>{
    const el=document.createElement('div');
    el.className='hand-card '+c.tier+(battleState.busy?' disabled':'');
    el.textContent=c.entry.k;
    el.onclick=()=>{ if(!battleState.busy) playerPlayCard(idx); };
    row.appendChild(el);
  });
}

function miniCardFrontHTML(entry,tier){
  const pw=powerOf(entry,tier);
  const type=entry.type||'火';
  return `<div class="rarity-tag" style="position:static; display:inline-block; margin-bottom:2px;">${TIER_NAME[tier]}</div>
    <div class="type-badge" style="position:static; display:inline-block; margin:2px 0 0; background:${TYPE_COLOR[type]}55; border-color:${TYPE_COLOR[type]};">${TYPE_EMOJI[type]} ${type}</div>
    <div class="kanji">${entry.k}</div>
    <div class="atk-name" style="position:static; display:inline-block; margin-top:2px;">${entry.atk||''}</div>
    <div class="power"><span class="lbl">ちから</span>${pw}</div>`;
}

function playerPlayCard(idx){
  const state=battleState;
  if(state.busy) return;
  state.busy=true;
  try{ sfx('tap'); }catch(e){}
  const pc = state.playerHand.splice(idx,1)[0];
  const oppIdx = Math.floor(Math.random()*state.oppHand.length);
  const oc = state.oppHand.splice(oppIdx,1)[0];
  renderPlayerHand();
  document.getElementById('round-result').textContent='';

  const pFront=document.getElementById('p-card-front');
  const oFront=document.getElementById('o-card-front');
  pFront.className='card-face card-front '+pc.tier;
  pFront.innerHTML=miniCardFrontHTML(pc.entry,pc.tier);
  oFront.className='card-face card-front '+oc.tier;
  oFront.innerHTML=miniCardFrontHTML(oc.entry,oc.tier);
  const pCardEl=document.getElementById('p-card'), oCardEl=document.getElementById('o-card');
  pCardEl.classList.remove('flipped'); oCardEl.classList.remove('flipped');
  pCardEl.style.filter='none'; oCardEl.style.filter='none';

  try{ sfx('flip'); }catch(e){}
  setTimeout(()=>{
    pCardEl.classList.add('flipped'); oCardEl.classList.add('flipped');
    // こうげきフェイズ演出
    setTimeout(()=>{ playAttackEffect(pCardEl, pc, 'left'); }, 150);
    setTimeout(()=>{ playAttackEffect(oCardEl, oc, 'right'); }, 650);
    setTimeout(()=>{ resolveRound(pc, oc, pCardEl, oCardEl); }, 1250);
  },50);
}

function playAttackEffect(cardEl, card, side){
  try{ sfx(card.tier==='mythic' ? 'ur' : card.tier); }catch(e){}
  const wrap=document.getElementById('battle-arena-wrap');
  if(!wrap) return;
  const burst=document.createElement('div');
  burst.className='atk-burst-text '+card.tier;
  burst.textContent='⚔️ '+(card.atk_name||card.entry.atk||'');
  burst.style.left = side==='left' ? '30%' : '70%';
  wrap.appendChild(burst);
  const ring=document.createElement('div');
  ring.className='impact-ring';
  ring.style.left = side==='left' ? '30%' : '70%';
  ring.style.borderColor = {n:'#9aa5b1',r:'#4fc3f7',sr:'#ffca28',ur:'#ff6ec7',mythic:'#ffd700'}[card.tier];
  wrap.appendChild(ring);
  cardEl.style.filter = 'drop-shadow(0 0 16px '+({n:'#9aa5b1',r:'#4fc3f7',sr:'#ffca28',ur:'#ff6ec7',mythic:'#ffd700'}[card.tier])+')';
  if(card.tier==='sr'||card.tier==='ur'||card.tier==='mythic'){
    const app=document.getElementById('app');
    app.classList.add('shake-active');
    setTimeout(()=>app.classList.remove('shake-active'), 400);
  }
  setTimeout(()=>{ burst.remove(); ring.remove(); }, 900);
}

function resolveRound(pc, oc, pCardEl, oCardEl){
  const state=battleState;
  const pType=pc.entry.type||'火', oType=oc.entry.type||'火';
  const pMult=typeMatchup(pType, oType);
  const oMult=typeMatchup(oType, pType);
  const basePP=powerOf(pc.entry,pc.tier), baseOP=powerOf(oc.entry,oc.tier);
  const pp=Math.round(basePP*pMult), op=Math.round(baseOP*oMult);
  let msg='';
  if(pMult===2) msg+='🔥 タイプ相性ばつぐん！あなたの攻撃力2倍！ ';
  if(oMult===2) msg+='💢 あいての相性ばつぐん！むこうの攻撃力2倍！ ';
  let resultMsg;
  if(pp>op){
    state.playerScore++; resultMsg='🎉 あなたの かち！ ('+pp+' vs '+op+')';
    try{ sfx('r'); }catch(e){} pCardEl.style.filter='drop-shadow(0 0 14px #4fc3f7)'; oCardEl.style.filter='none';
  } else if(pp<op){
    state.oppScore++; resultMsg='😢 まけ… ('+pp+' vs '+op+')';
    try{ sfx('n'); }catch(e){} oCardEl.style.filter='drop-shadow(0 0 14px #ff5c5c)'; pCardEl.style.filter='none';
  } else {
    resultMsg='🤝 ひきわけ ('+pp+' vs '+op+')'; pCardEl.style.filter='none'; oCardEl.style.filter='none';
  }
  document.getElementById('round-result').innerHTML = (msg? `<div style="font-size:12px; opacity:.9; margin-bottom:4px;">${msg}</div>`:'') + resultMsg;
  document.getElementById('p-score').textContent=state.playerScore;
  document.getElementById('o-score').textContent=state.oppScore;
  state.busy=false;
  if(state.playerHand.length===0){
    setTimeout(()=>{ try{ showBattleResult(); }catch(e){ console.warn(e); } }, 900);
  } else {
    renderPlayerHand();
  }
}

function showBattleResult(){
  const state=battleState;
  let title, reward='';
  const isWin = state.playerScore>state.oppScore;
  if(isWin){
    title='🏆 しょうり！';
    STATE.battleWins=(STATE.battleWins||0)+1;
    if(state.mode==='free'){
      if(STATE.tickets<TICKET_MAX){ STATE.tickets=Math.min(TICKET_MAX,STATE.tickets+1); reward='ごほうび: 🎟️チケット+1！'; }
      try{ sfx('ur'); }catch(e){}
    } else if(state.mode==='gym'){
      const leader=state.npc;
      const firstTime = !STATE.badges[leader.id];
      STATE.badges[leader.id]=true;
      if(STATE.tickets<TICKET_MAX) STATE.tickets=Math.min(TICKET_MAX,STATE.tickets+1);
      if(firstTime){
        reward = `🏅 「${leader.name}バッジ」を てにいれた！`;
        if(leader.reward && /ひでんチケット\+2/.test(leader.reward)){ STATE.specialTickets=(STATE.specialTickets||0)+2; reward+=' '+leader.reward; }
        else if(leader.reward){ STATE.specialTickets=(STATE.specialTickets||0)+1; reward+=' '+leader.reward; }
      } else {
        reward = 'バッジは すでに もっています(🎟️チケット+1)';
      }
      try{ sfx('ur'); }catch(e){}
    } else if(state.mode==='elite'){
      const member=state.npc;
      const firstTime = !STATE.eliteDefeated[member.id];
      STATE.eliteDefeated[member.id]=true;
      if(firstTime){
        reward = `👑 ${member.name} を うちやぶった！`;
        if(allEliteDefeated() && !STATE.champion){
          STATE.champion=true;
          reward += '　🎉 四天王 せいは！おめでとう！';
        }
      } else {
        reward = 'すでに うちやぶった あいてです';
      }
      try{ sfx('ur'); }catch(e){}
    }
  } else if(state.playerScore<state.oppScore){
    title='😭 はいぼく…'; STATE.battleLosses=(STATE.battleLosses||0)+1;
  } else { title='🤝 ひきわけ'; }
  saveState();
  const body=document.getElementById('battle-body');
  const backLabel = state.mode==='free' ? 'ホームへ' : (state.mode==='gym' ? 'ジムへもどる' : '四天王のまへ');
  body.innerHTML=`
    <div style="text-align:center; margin-top:60px;">
      ${state.npc? `<div style="font-size:30px;">${state.npc.icon}</div><div style="font-size:13px; opacity:.7; margin-bottom:6px;">${state.npc.name}</div>`:''}
      <div style="font-size:30px; font-weight:800; margin-bottom:10px;">${title}</div>
      <div style="font-size:17px; margin-bottom:8px;">${state.playerScore} - ${state.oppScore}</div>
      <div style="font-size:13px; opacity:.9; margin-bottom:26px; min-height:18px;">${reward}</div>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn secondary" id="btn-battle-again">もういちど</button>
        <button class="btn" id="btn-battle-home">${backLabel}</button>
      </div>
    </div>`;
  document.getElementById('btn-battle-again').onclick=()=>{ try{ sfx('tap'); }catch(e){} openBattle(state.mode, state.npc); };
  document.getElementById('btn-battle-home').onclick=()=>{
    try{ sfx('tap'); }catch(e){}
    if(state.mode==='free') goHome();
    else if(state.mode==='gym') openGymScreen();
    else openGymScreen('elite');
  };
}

            <div class="gym-name">${e.name} <span class="gym-title">${e.title}</span></div>
